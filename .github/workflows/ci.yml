name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a broken Dockerfile here rather than on the shop's machine
      # halfway through a deploy.
      - run: docker build -t shop-inventory:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name ci-check -p 5000:5000 shop-inventory:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "never became healthy"; docker logs ci-check; exit 1
